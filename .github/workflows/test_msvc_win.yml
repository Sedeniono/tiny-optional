name: msvc windows

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '20 3 * * *'


jobs:
  all:
    strategy:
      fail-fast: false
      matrix:
        platform: [x64, Win32]
        cpp_version: [c++17, c++20]
        build_flags: [/permissive-,  /permissive- /O2 /Oi /GL /DNDEBUG]

        include:
        - cpp_version: c++17
          platform: x64
          build_flags: /permissive
        - cpp_version: c++20
          platform: x64
          build_flags: /permissive
        - cpp_version: c++23preview
          platform: x64
          build_flags: ~
          # Also include a variation with disabled UB tricks (not for all to limit resource consumption).
        - cpp_version: c++20
          platform: x64
          build_flags: /DTINY_OPTIONAL_USE_SEPARATE_BOOL_INSTEAD_OF_UB_TRICKS

    runs-on: windows-2022
    timeout-minutes: 10

    steps:
    - uses: actions/checkout@v6

    - name: Configure
      run: >
        cmake -S . -B build
        -G "Visual Studio 17 2022"
        -DTINY_OPTIONAL_BUILD_TESTS=ON
        -DCMAKE_BUILD_TYPE=
        -A ${{ matrix.platform }}
        -DTINY_OPTIONAL_ADDITIONAL_FLAGS="${{ format('/std:{0} {1}', matrix.cpp_version, matrix.build_flags) }}"

    - name: Build
      run: cmake --build build --config Build --parallel

    - name: Run tests
      run: ctest --test-dir build --build-config Build --output-on-failure --parallel
