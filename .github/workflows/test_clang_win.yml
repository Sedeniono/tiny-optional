name: clang windows

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '20 3 * * *'


jobs:
  all:
    strategy:
      fail-fast: false
      matrix:
        # Earlier versions are not supported by the installed Microsoft STL that is used by clang.
        clang_version: [19, 20, 21]
        cpp_version: [c++17, c++20, c++23, c++26]
        build_flags: [~ ,  -O3 -DNDEBUG,  -O3 -DNDEBUG -ffast-math]

        include:
          # Also include a few variations with disabled UB tricks (not for all to limit resource consumption).
          - clang_version: 20
            cpp_version: c++20
            build_flags: -DTINY_OPTIONAL_USE_SEPARATE_BOOL_INSTEAD_OF_UB_TRICKS

    runs-on: windows-2022
    timeout-minutes: 10

    steps:
    - uses: actions/checkout@v6

    - name: Install clang
      uses: KyleMayes/install-llvm-action@v2.0.9
      with:
        version: ${{ matrix.clang_version }}

    - name: Configure
      run: >
        cmake -S . -B build 
        -G Ninja
        -DTINY_OPTIONAL_BUILD_TESTS=ON
        -DCMAKE_BUILD_TYPE=
        -DCMAKE_CXX_COMPILER=clang++
        -DTINY_OPTIONAL_ADDITIONAL_FLAGS="${{ format('-std={0} {1}', matrix.cpp_version, matrix.build_flags) }}"

    - name: Build
      run: cmake --build build --parallel

    - name: Run tests
      run: ctest --test-dir build --output-on-failure --parallel
