name: clang mac

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '20 3 * * *'
  

jobs:
  all:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15-intel] # x64

        # Note: No clang version variation since the macOS runners do not have versioned executables (e.g. clang++-17).
        cpp_version: [c++17, c++20]
        build_flags: [~ ,  -O3 -DNDEBUG,  -O3 -DNDEBUG -ffast-math]
        
        include:
          # Also include a few variations with disabled UB tricks (not for all to limit resource consumption).
          # Especially include some on arm64 where the UB tricks are not supported by tiny::optional.
          - os: macos-15-intel # x64
            cpp_version: c++20
            build_flags: -DTINY_OPTIONAL_USE_SEPARATE_BOOL_INSTEAD_OF_UB_TRICKS
          - os: macos-14 # arm64
            cpp_version: c++17
            build_flags: -DTINY_OPTIONAL_USE_SEPARATE_BOOL_INSTEAD_OF_UB_TRICKS
          - os: macos-14 # arm64
            cpp_version: c++20
            build_flags: -DTINY_OPTIONAL_USE_SEPARATE_BOOL_INSTEAD_OF_UB_TRICKS
          - os: macos-14 # arm64
            cpp_version: c++20
            build_flags: -DTINY_OPTIONAL_USE_SEPARATE_BOOL_INSTEAD_OF_UB_TRICKS -O3 -DNDEBUG
          - os: macos-15 # arm64
            cpp_version: c++20
            build_flags: -DTINY_OPTIONAL_USE_SEPARATE_BOOL_INSTEAD_OF_UB_TRICKS
          - os: macos-15 # arm64
            cpp_version: c++20
            build_flags: -DTINY_OPTIONAL_USE_SEPARATE_BOOL_INSTEAD_OF_UB_TRICKS -O3 -DNDEBUG
            
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10

    steps:
    - uses: actions/checkout@v6

    - name: Configure
      run: >
        cmake -S . -B build 
        -DTINY_OPTIONAL_BUILD_TESTS=ON
        -DCMAKE_BUILD_TYPE=
        -DCMAKE_CXX_COMPILER=clang++
        -DTINY_OPTIONAL_ADDITIONAL_FLAGS="${{ format('-std={0} {1}', matrix.cpp_version, matrix.build_flags) }}"

    - name: Build
      run: cmake --build build --parallel

    - name: Run tests
      run: ctest --test-dir build --output-on-failure --parallel
